<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skate Parkour</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Skate Parkour 🛹</h1>

  <!-- O canvas é o "ecrã" onde desenhamos o jogo -->
  <canvas id="game" width="800" height="500"></canvas>

  <p class="controls">
    ← → mover &nbsp;|&nbsp; ESPAÇO saltar &nbsp;|&nbsp; X/C/Z truques &nbsp;|&nbsp; F = ecrã inteiro
  </p>

  <!-- Botão de ecrã inteiro -->
  <button id="fsBtn" title="Alternar ecrã inteiro">⛶ ECRÃ INTEIRO (F)</button>

  <script src="game.js"></script>
</body>
</html>
